<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enrique Antolí Team</title>
<meta name="description" content="Formularios online de Enrique Antolí Team: cuestionario inicial y revisión semanal.">
<meta name="theme-color" content="#0C1612">
<style>
:root { --bg: #EEF1EF; --surface: #FFFFFF; --ink: #14211C; --muted: #5A6A63; --line: #D3DCD7; --accent: #1B6B50; --accent-ink: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0F1613; --surface: #17211D; --ink: #E6EEEA; --muted: #93A59C; --line: #2A3A33; --accent: #4FBF97; --accent-ink: #08140F; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0F1613; --surface: #17211D; --ink: #E6EEEA; --muted: #93A59C; --line: #2A3A33; --accent: #4FBF97; --accent-ink: #08140F; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
main { width: 100%; max-width: 460px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 28px; line-height: 1.15; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
.card { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; color: var(--ink); text-decoration: none; }
.card strong { font-size: 18px; }
.card span { color: var(--muted); font-size: 14px; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
</style>
</head>
<body>
<main>
  <h1>Enrique Antolí Team</h1>
  <p>Elige el formulario que te toca y envíamelo por WhatsApp o por email.</p>
  <a class="card" href="cuestionario/"><strong>Cuestionario inicial</strong><span>Para empezar: tus datos, objetivo y rutina actual.</span></a>
  <a class="card" href="revision/"><strong>Revisión semanal</strong><span>Para tu revisión de cada semana.</span></a>
</main>
</body>
</html>
