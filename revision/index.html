<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisión semanal · Enrique Antolí Team</title>
<meta name="description" content="Revisión semanal de Enrique Antolí Team. Las respuestas se envían por WhatsApp o email.">
<meta name="theme-color" content="#0C1612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1EF; --surface: #FFFFFF; --field: #F6F8F7; --ink: #14211C; --muted: #5A6A63; --line: #D3DCD7;
  --accent: #1B6B50; --accent-ink: #FFFFFF; --soft: #E3F0EA; --warn-bg: #FBEFD5; --warn-ink: #5E4200; --err: #B3261E;
  --wa: #1FA855;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #17211D; --field: #121B17; --ink: #E6EEEA; --muted: #93A59C; --line: #2A3A33;
    --accent: #4FBF97; --accent-ink: #08140F; --soft: #1C2D26; --warn-bg: #3A2F10; --warn-ink: #F2D58A; --err: #F2A099; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #17211D; --field: #121B17; --ink: #E6EEEA; --muted: #93A59C; --line: #2A3A33;
  --accent: #4FBF97; --accent-ink: #08140F; --soft: #1C2D26; --warn-bg: #3A2F10; --warn-ink: #F2D58A; --err: #F2A099; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px calc(110px + env(safe-area-inset-bottom)); }
header { padding: 8px 0 18px; }
.eyebrow { font: 600 12px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 32px/1.1 var(--font-display); margin: 8px 0 10px; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin: 0 0 18px; position: sticky; top: 8px; z-index: 5; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 15px/1 var(--font-body); padding: 12px 8px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px 8px; margin: 0 0 14px; }
section.card h2 { font: 700 20px/1.2 var(--font-display); margin: 0 0 4px; }
section.card .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.f { margin: 0 0 16px; }
.f > label, .f > .lab { display: block; font-weight: 600; font-size: 15px; margin: 0 0 6px; }
.req { color: var(--accent); }
.hint { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
input[type=text], input[type=email], input[type=number], input[type=tel], select, textarea {
  width: 100%; font: 16px/1.4 var(--font-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.row4 .f > label { font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--field); font-size: 15px; cursor: pointer; }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.f.bad input, .f.bad select, .f.bad textarea, .f.bad .opt span { border-color: var(--err); }
.f .msg { color: var(--err); font-size: 13px; margin-top: 4px; display: none; }
.f.bad .msg { display: block; }
.note { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 12px; font: 700 16px/1 var(--font-body); padding: 14px 18px; min-height: 50px; cursor: pointer; }
.btn.wa { background: var(--wa); color: #fff; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.sec { background: var(--field); color: var(--ink); border: 1px solid var(--line); }
.status { font-size: 13px; color: var(--muted); max-width: 760px; margin: 6px auto 0; min-height: 1em; }
[hidden] { display: none !important; }
@media (max-width: 520px) { h1 { font-size: 27px; } .row2 { grid-template-columns: 1fr; gap: 0; } .btn.sec { padding: 14px 12px; } }

.hero-in { max-width: var(--hero-w, 728px); margin: 0 auto; display: grid; gap: 20px; align-items: center; }
.hero-txt { min-width: 0; }
.hero .brand { font: 600 17px/1.2 var(--font-display); color: #fff; margin: 0 0 14px; }
.hero h1 { font: 700 clamp(30px, 6vw, 42px)/1.04 var(--font-display); letter-spacing: -.015em; color: #fff; margin: 0 0 12px; }
.hero .lede { color: rgba(244,247,245,.86); margin: 0; font-size: 16px; max-width: 54ch; }
.hero-img { display: block; width: 100%; height: auto; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.24); box-shadow: 0 14px 34px rgba(0,0,0,.42); background: #0C1612; }
@media (min-width: 760px) {
  .hero { padding-block: 36px 38px; }
  .hero-in { grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; }
}
.hero.compact { padding-block-end: 24px; }
.hero.compact h1 { font-size: clamp(26px, 5vw, 36px); }
@media (min-width: 760px) {
  .hero.compact { padding-block: 28px 28px; }
  .hero.compact .hero-in { grid-template-columns: minmax(0, 1fr) 280px; }
}

[hidden] { display: none !important; }
.btn.wa { flex: 1 1 0; padding: 14px 10px; }
.btn.mail { flex: 1 1 0; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 10px; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn:focus-visible, .lnk:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar .sub { max-width: 760px; margin: 6px auto 0; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.bar .sub .status { margin: 0; flex: 1; min-width: 0; }
.lnk { background: none; border: 0; padding: 4px 0; font: 700 13px/1.2 var(--font-body); color: var(--accent); text-decoration: underline; cursor: pointer; white-space: nowrap; }
a.lnk { display: inline-block; max-width: 760px; margin: 2px auto 0; }
.bar .fb { max-width: 760px; margin: 0 auto; }
.wrap { padding-bottom: calc(138px + env(safe-area-inset-bottom)); }
</style>

    { id: "horas_sueno", l: "Horas de sueño", t: "radio", r: 1, o: ["5", "6", "7", "8", "9", "10"] },
    { id: "calidad_sueno", l: "Calidad del sueño", t: "radio", r: 1, o: ["MUY MALA", "MALA", "DECENTE", "BUENA", "COMO UN BEBÉ 👶"] },
    { id: "dieta", l: "¿Has cumplido la dieta?", t: "radio", o: ["Casi siempre", "La mayoría de días", "A medias", "Poco"] },
    { id: "contento", l: "¿Estás content@ conmigo y con el servicio? Cualquier comentario me ayuda y me motiva", t: "textarea" },
    { id: "comentarios", l: "Comentarios", t: "textarea", ph: "Molestias, cambios de horario, ejercicios que te cuestan…" }
  ] }
];

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var uid = 0;
function fieldHtml(ns, x) {
  if (x.row) return '<div class="' + (x.cls || "row2") + '">' + x.row.map(function (y) { return fieldHtml(ns, y); }).join("") + "</div>";
  var id = ns + "-" + x.id, req = x.r ? ' <span class="req" aria-hidden="true">*</span>' : "", h = "";
  var attrs = ' id="' + id + '" name="' + x.id + '"' + (x.r ? " required" : "") + (x.ph ? ' placeholder="' + esc(x.ph) + '"' : "");
  if (x.t === "textarea") h = '<label for="' + id + '">' + esc(x.l) + req + '</label><textarea' + attrs + "></textarea>";
  else if (x.t === "select") h = '<label for="' + id + '">' + esc(x.l) + req + '</label><select' + attrs + '><option value="">Elige…</option>' + x.o.map(function (o) { return "<option>" + esc(o) + "</option>"; }).join("") + "</select>";
  else if (x.t === "radio" || x.t === "checks" || x.t === "yesno") {
    var opts = x.t === "yesno" ? ["No", "Sí"] : x.o, type = x.t === "checks" ? "checkbox" : "radio";
    h = '<div class="lab" id="' + id + '-l">' + esc(x.l) + req + '</div><div class="opts" role="' + (type === "radio" ? "radiogroup" : "group") + '" aria-labelledby="' + id + '-l">' +
      opts.map(function (o) { return '<label class="opt"><input type="' + type + '" name="' + x.id + '" value="' + esc(o) + '"><span>' + esc(o) + "</span></label>"; }).join("") + "</div>";
  } else if (x.t === "consent") h = '<label class="check"><input type="checkbox"' + attrs + '><span>' + esc(x.l) + req + "</span></label>";
  else {
    /* Números como texto con teclado decimal: así se aceptan comas (74,5) en cualquier móvil. */
    var t = x.t === "number" ? "text" : x.t, extra = x.t === "number" ? ' inputmode="decimal" autocomplete="off"' : x.t === "email" ? ' autocomplete="email"' : "";
    h = '<label for="' + id + '">' + esc(x.l) + req + '</label><input type="' + t + '"' + attrs + extra + ">";
  }
  return '<div class="f" data-id="' + x.id + '">' + h + '<div class="msg">Este campo es obligatorio.</div></div>';
}
function build(form, ns, def) {
  form.innerHTML = def.map(function (s) {
    return '<section class="card"><h2>' + esc(s.h) + "</h2>" + (s.sub ? '<p class="sub">' + esc(s.sub) + "</p>" : '<p class="sub"></p>') + s.f.map(function (x) { return fieldHtml(ns, x); }).join("") + "</section>";
  }).join("");
}
function flat(def) { var a = []; def.forEach(function (s) { s.f.forEach(function (x) { if (x.row) x.row.forEach(function (y) { a.push(y); }); else a.push(x); }); }); return a; }
function values(form, def) {
  var v = {};
  flat(def).forEach(function (x) {
    if (x.t === "checks") v[x.id] = Array.prototype.map.call(form.querySelectorAll('input[name="' + x.id + '"]:checked'), function (i) { return i.value; }).join(", ");
    else if (x.t === "radio" || x.t === "yesno") { var c = form.querySelector('input[name="' + x.id + '"]:checked'); v[x.id] = c ? c.value : ""; }
    else if (x.t === "consent") v[x.id] = form.elements[x.id].checked ? "Sí" : "";
    else v[x.id] = (form.elements[x.id].value || "").trim();
  });
  return v;
}
function applyShow(form, def) {
  var v = values(form, def);
  flat(def).forEach(function (x) { if (x.show) form.querySelector('.f[data-id="' + x.id + '"]').hidden = !x.show(v); });
}
function validate(form, def) {
  var v = values(form, def), first = null;
  flat(def).forEach(function (x) {
    var box = form.querySelector('.f[data-id="' + x.id + '"]');
    var bad = !!x.r && !box.hidden && !v[x.id];
    if (!bad && x.t === "number" && v[x.id]) { var n = parseFloat(v[x.id].replace(",", ".")); bad = isNaN(n) || (x.min != null && n < x.min) || (x.max != null && n > x.max); box.querySelector(".msg").textContent = bad ? "Revisa el número." : "Este campo es obligatorio."; }
    box.classList.toggle("bad", bad);
    if (bad && !first) first = box;
  });
  return first;
}
function message(kind, def, v) {
  var out = [kind === "ini" ? "*CUESTIONARIO INICIAL · " + BRAND.toUpperCase() + "*" : "*REVISIÓN SEMANAL · " + BRAND.toUpperCase() + "*"];
  def.forEach(function (s) {
    var lines = [];
    s.f.forEach(function (x) {
      (x.row || [x]).forEach(function (y) {
        if (y.t === "consent" || (y.show && !y.show(v))) return;
        var val = v[y.id]; if (!val) return;
        lines.push("• " + y.l + ": " + val + (y.unit ? " " + y.unit : ""));
      });
    });
    if (lines.length) out.push("", "*" + s.h + "*", lines.join("\n"));
  });
  if (kind === "rev") {
    var ps = ["p_lun", "p_mar", "p_mie", "p_jue", "p_vie", "p_sab", "p_dom"].map(function (k) { return parseFloat(String(v[k] || "").replace(",", ".")); }).filter(function (n) { return !isNaN(n); });
    if (ps.length) {
      var avg = ps.reduce(function (a, b) { return a + b; }, 0) / ps.length;
      out.push("", "*Media semanal (en ayunas): " + avg.toFixed(2).replace(".", ",") + " kg* (" + ps.length + (ps.length === 1 ? " día" : " días") + ")");
    }
  }
  if (kind === "ini") out.push("", "Enviado desde el cuestionario de " + BRAND + ". Ahora te mando las fotos iniciales (frente, espaldas y perfiles).");
  return out.join("\n");
}

var forms = { ini: document.getElementById("form-ini"), rev: document.getElementById("form-rev") }, defs = { ini: INI, rev: REV }, cur = "ini";
build(forms.ini, "i", INI); build(forms.rev, "r", REV);
var DRAFT = MODE === "ini" ? "eat.cuestionario-inicial.v1" : "eat.revision-semanal.v1";
function saveDraft() { try { var o = {}; o[MODE] = values(forms[MODE], defs[MODE]); localStorage.setItem(DRAFT, JSON.stringify(o)); } catch (e) {} }
function restore(form, def, v) {
  if (!v) return;
  flat(def).forEach(function (x) {
    var val = v[x.id]; if (!val) return;
    if (x.t === "checks") val.split(", ").forEach(function (o) { var i = form.querySelector('input[name="' + x.id + '"][value="' + CSS.escape(o) + '"]'); if (i) i.checked = true; });
    else if (x.t === "radio" || x.t === "yesno") { var i = form.querySelector('input[name="' + x.id + '"][value="' + CSS.escape(val) + '"]'); if (i) i.checked = true; }
    else if (x.t === "consent") form.elements[x.id].checked = val === "Sí";
    else form.elements[x.id].value = val;
  });
}
try { var d = JSON.parse(localStorage.getItem(DRAFT) || "null"); if (d && d[MODE]) restore(forms[MODE], defs[MODE], d[MODE]); } catch (e) {}
cur = MODE;
[MODE].forEach(function (k) {
  applyShow(forms[k], defs[k]);
  forms[k].addEventListener("input", function (e) { applyShow(forms[k], defs[k]); var b = e.target.closest(".f"); if (b && b.classList.contains("bad")) validate(forms[k], defs[k]); saveDraft(); });
  forms[k].addEventListener("change", function () { applyShow(forms[k], defs[k]); saveDraft(); });
});
var TXT = {
  ini: ["Cuestionario inicial", "Cuéntame cómo estás y qué quieres conseguir. Con esto preparo tu plan de entrenamiento y nutrición. Al terminar, envíamelo por WhatsApp (se abre un chat conmigo con todo listo) o por email."],
  rev: ["Revisión semanal", "Rellénala el día de tu revisión. Envíamela por WhatsApp o por email; después mándame también las fotos por WhatsApp si toca esta semana."]
};
function show(k) {
  cur = k;
  forms.ini.hidden = k !== "ini"; forms.rev.hidden = k !== "rev";
  document.getElementById("title").textContent = TXT[k][0]; document.getElementById("lede").textContent = TXT[k][1];
  document.getElementById("status").textContent = "Elige cómo enviármelo: WhatsApp o email.";
}
show(cur);

function ready() {
  var bad = validate(forms[cur], defs[cur]), st = document.getElementById("status");
  if (bad) { st.textContent = "Faltan campos obligatorios (marcados en rojo)."; bad.scrollIntoView({ behavior: "smooth", block: "center" }); var i = bad.querySelector("input,select,textarea"); if (i) setTimeout(function () { i.focus({ preventScroll: true }); }, 300); return null; }
  return message(cur, defs[cur], values(forms[cur], defs[cur]));
}
document.getElementById("send").addEventListener("click", function () {
  var m = ready(); if (!m) return;
  var url = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(m);
  document.getElementById("status").textContent = "Abriendo WhatsApp… Si no se abre, pulsa «Copiar respuestas» y pégalo en el chat.";
  var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById("copy").addEventListener("click", function () {
  var m = ready(); if (!m) return;
  var st = document.getElementById("status");
  function fallback() { var t = document.createElement("textarea"); t.value = m; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); st.textContent = "Respuestas copiadas. Pégalas en WhatsApp."; } catch (e) { st.textContent = "No se pudo copiar automáticamente."; } t.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m).then(function () { st.textContent = "Respuestas copiadas. Pégalas en WhatsApp."; }, fallback); else fallback();
});
/* Envío por email (FormSubmit, sin servidor propio). La primera vez hay que confirmar el correo desde el aviso que llega a MAIL_TO. */
var MAIL_TO = "antolienrique@gmail.com";
function emailFields(kind, def, v) {
  var rows = [];
  def.forEach(function (s) {
    s.f.forEach(function (x) {
      (x.row || [x]).forEach(function (y) {
        if (y.t === "consent" || (y.show && !y.show(v))) return;
        var val = v[y.id]; if (!val) return;
        rows.push([s.h + " › " + y.l, val]);
      });
    });
  });
  return rows;
}
document.getElementById("mail").addEventListener("click", function () {
  var m = ready(); if (!m) return;
  var btn = this, st = document.getElementById("status"), fb = document.getElementById("mailfb");
  var v = values(forms[cur], defs[cur]);
  var subject = (cur === "ini" ? "Cuestionario inicial" : "Revisión semanal") + " · " + (v.nombre || "cliente") + " · " + BRAND;
  var data = { _subject: subject, _template: "table", _captcha: "false" };
  if (v.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) data._replyto = v.email;
  emailFields(cur, defs[cur], v).forEach(function (r) { data[r[0]] = r[1]; });
  var plain = m.replace(/\*/g, "");
  fb.hidden = true; btn.disabled = true; st.textContent = "Enviando…";
  function fail() {
    btn.disabled = false;
    var body = plain.length < 1500 ? plain : "Pega aquí las respuestas (pulsa «Copiar respuestas» antes).";
    fb.href = "mailto:" + MAIL_TO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    fb.hidden = false;
    st.textContent = "No se pudo enviar el email desde aquí. Usa WhatsApp o abre tu correo con el botón de abajo.";
  }
  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; fail(); } }, 20000);
  fetch("https://formsubmit.co/ajax/" + MAIL_TO, {
    method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data)
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (done) return; done = true; clearTimeout(timer);
    if (j && (j.success === true || j.success === "true")) { btn.disabled = false; st.textContent = "✔ Enviado por email. Si quieres, mándalo también por WhatsApp."; }
    else fail();
  }).catch(function () { if (done) return; done = true; clearTimeout(timer); fail(); });
});
